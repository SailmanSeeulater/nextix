[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextix-agent-runner"
version = "0.1.0"
description = "nexTix sandbox runner: clones the repo, runs the Claude agent, reports back"
requires-python = ">=3.12"
# Keep these in step with the pip install line in the Dockerfile.
dependencies = [
  "claude-agent-sdk>=0.2.160,<0.3",
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
  "pillow>=11,<13",
  "pixelmatch>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools]
py-modules = ["runner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["runner"]

[tool.mypy]
python_version = "3.12"
# The runner only ever runs in the Linux sandbox (process groups, /proc, SIGKILL).
platform = "linux"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:runner.*"]
