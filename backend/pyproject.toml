[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextix"
version = "0.1.0"
description = "nexTix — a ticketing system for coding agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8,<3",
  "PyYAML>=6.0",
  "sse-starlette>=2.1",
  "anthropic>=1.8,<2",
  # Runs Claude Code for subscription-billed triage and agent runs; its Linux wheel
  # bundles the Claude Code binary, so the image needs no separate install.
  "claude-agent-sdk>=0.2.160,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "testcontainers[postgres,redis]>=4.7",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "celery-types",
]

[tool.setuptools.packages.find]
include = ["nextix*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["nextix", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["nextix"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:nextix.*"]
