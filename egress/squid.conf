# Egress allowlist for agent sandboxes. The `agents` network is internal (no route out),
# so this proxy is the sandboxes' only way to the internet.
#
# Add a domain only when a run actually breaks on it. Each request is logged, a refused
# one as TCP_DENIED/403:
#   docker compose exec egress tail -n 50 /var/log/squid/access.log
# Then `docker compose restart egress`.

http_port 3128

# -n: match names only, never a reverse lookup of an IP literal (whoever owns an IP
# controls its reverse DNS, so it could claim to be a github.com host).
acl allowed dstdomain -n .github.com .githubusercontent.com
acl allowed dstdomain -n api.anthropic.com
acl allowed dstdomain -n registry.npmjs.org
acl allowed dstdomain -n pypi.org files.pythonhosted.org
# .gradle.org covers plugins.gradle.org; Squid refuses to start if both are listed.
acl allowed dstdomain -n repo.maven.apache.org .gradle.org

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# A pass-through filter, not a cache.
cache deny all
# Squid drops privileges before logging, so it can't open /dev/stdout; the log stays in
# the image's default file.
access_log stdio:/var/log/squid/access.log
