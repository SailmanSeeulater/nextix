[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextix-cli"
version = "0.1.0"
description = "Command-line client for nexTix, the agent task board"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  # `nextix mcp`: the MCP server for Claude Code / Claude Desktop (v2: MCPServer).
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
nextix = "nextix_cli.main:app"

[tool.setuptools.packages.find]
include = ["nextix_cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option(...) in defaults is the Typer idiom

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
